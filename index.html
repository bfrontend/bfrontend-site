<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bfrontend</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1120 60%);
    color: #e2e8f0;
  }
  main { text-align: center; padding: 48px 24px; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 12px; letter-spacing: -0.03em; }
  p { margin: 0 0 28px; color: #94a3b8; }
  a {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: #e2e8f0; color: #0b1120; text-decoration: none; font-weight: 600;
    transition: transform .15s ease, opacity .15s ease;
  }
  a:hover { transform: translateY(-1px); opacity: .9; }
</style>
</head>
<body>
  <main>
    <h1>bfrontend</h1>
    <p>bfrontend.loc.cc</p>
    <a href="https://github.com/bfrontend">GitHub</a>
  </main>
</body>
</html>
